name: Browser QA of reviewed chapters
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect desktop and mobile MathML, SVG, interaction, overflow
        run: python scripts/browser_qa.py --output qa/chapter-review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter-qa-screenshots
          path: qa/chapter-review/
          retention-days: 14
