<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="fig09c-title fig09c-desc"><title id="fig09c-title">均值与正弦分量在功率谱中表现为冲激，须显式说明是否含直流分量</title><desc id="fig09c-desc">左图非零均值过程的功率谱由一段连续谱加一个位于零频率的冲激组成；右图零均值随机相位正弦的功率谱是位于正负ω零处的两个冲激，零频率处没有分量。</desc><rect width="1000" height="400" rx="19" fill="#fffdf8"/><text x="28" y="40" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">冲激成分要不要算进去？取决于公式约定与直流分量</text><rect x="40" y="62" width="430" height="300" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="60" y="90" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#137f83">均值 μ≠0：S(ω)=2πμ²δ(ω)+S_W(ω)</text><line x1="70" y1="300" x2="450" y2="300" stroke="#dce7e6"/><line x1="260" y1="120" x2="260" y2="312" stroke="#dce7e6"/><path d="M80 296 Q170 292 220 260 Q255 236 260 236 Q290 262 330 288 Q400 296 440 297" fill="none" stroke="#7564ad" stroke-width="2.6"/><line x1="260" y1="300" x2="260" y2="150" stroke="#ce704f" stroke-width="4"/><polygon points="260,142 254,156 266,156" fill="#ce704f"/><text x="268" y="150" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ce704f">2πμ²δ(ω) 直流冲激</text><text x="330" y="252" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#7564ad">连续谱 S_W(ω)</text><text x="420" y="322" text-anchor="end" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">ω</text><rect x="530" y="62" width="430" height="300" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="550" y="90" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#137f83">零均值随机相位正弦：(πA²/2)[δ(ω−ω₀)+δ(ω+ω₀)]</text><line x1="560" y1="300" x2="940" y2="300" stroke="#dce7e6"/><line x1="750" y1="120" x2="750" y2="312" stroke="#dce7e6"/><line x1="670" y1="300" x2="670" y2="170" stroke="#137f83" stroke-width="4"/><polygon points="670,162 664,176 676,176" fill="#137f83"/><line x1="830" y1="300" x2="830" y2="170" stroke="#137f83" stroke-width="4"/><polygon points="830,162 824,176 836,176" fill="#137f83"/><text x="670" y="152" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#137f83">−ω₀</text><text x="830" y="152" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#137f83">+ω₀</text><text x="750" y="322" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">ω = 0 处无分量</text><text x="29" y="392" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">冲激是广义函数的记号，表示“功率集中在单一频率”；它不是有限高的尖峰。</text></svg>
