<text x="120" y="112" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#2f7d7b">Bartlett K=8 平均</text>
<text x="90" y="378" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5d7078">白噪声区逐点方差约从 相对方差 var/mean² 约从 1.21 降到 0.093（理论约 1/K=0.125），代价是频率分辨率由 1/N 变为 1/M。</text>
