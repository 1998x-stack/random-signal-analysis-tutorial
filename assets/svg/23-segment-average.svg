<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="t d">
<title id="t">分段平均把周期图的剧烈起伏压平</title>
<desc id="d">同一条 N=256 数据的原始周期图（浅色）与 K=8 段 Bartlett 平均（粗线）对比，平均后白噪声区的起伏明显收窄，真实谱峰保留但变宽。</desc>
