<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="fig14b-title fig14b-desc"><title id="fig14b-title">MA只有零点、AR只有极点、ARMA兼有</title><desc id="fig14b-desc">左图MA谱在某个频率处形成谷；中图AR谱形成尖锐的峰；右图ARMA谱同时具有峰和谷。曲线为教学示意。</desc><rect width="1000" height="400" rx="19" fill="#fffdf8"/><text x="28" y="40" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">谱的形状由极点和零点共同决定</text><rect x="40" y="62" width="290" height="290" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="60" y="90" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#137f83">MA(q)：只有零点（谷）</text><line x1="60" y1="290" x2="310" y2="290" stroke="#dce7e6"/><path d="M70 150 Q130 148 170 250 Q200 300 210 200 Q240 148 300 168" fill="none" stroke="#137f83" stroke-width="3"/><text x="185" y="322" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5d7078">ω</text><text x="70" y="268" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#137f83">谱谷</text><rect x="355" y="62" width="290" height="290" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="375" y="90" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ce704f">AR(p)：只有极点（峰）</text><line x1="375" y1="290" x2="625" y2="290" stroke="#dce7e6"/><path d="M385 270 Q470 268 490 120 Q510 268 605 272" fill="none" stroke="#ce704f" stroke-width="3"/><text x="500" y="322" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5d7078">ω</text><text x="502" y="112" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ce704f">谱峰</text><rect x="670" y="62" width="290" height="290" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="690" y="90" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#7564ad">ARMA(p,q)：峰谷兼有</text><line x1="690" y1="290" x2="940" y2="290" stroke="#dce7e6"/><path d="M700 250 Q760 246 790 140 Q810 130 830 210 Q860 280 930 258" fill="none" stroke="#7564ad" stroke-width="3"/><text x="815" y="322" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5d7078">ω</text><text x="29" y="384" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">图上曲线为教学示意；MA 可用零点造谷、AR 用极点造峰，ARMA 两者兼用。</text></svg>
