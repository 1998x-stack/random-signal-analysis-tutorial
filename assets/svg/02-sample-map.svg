<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 386" role="img" aria-labelledby="title desc"><title id="title">随机变量将样本结果映射到数轴</title><desc id="desc">抛两次公平硬币共有HH、HT、TH、TT四个等概率结果，随机变量X统计正面出现次数，将四个等概率结果映射为0、1、2三个值。</desc><rect width="1000" height="386" fill="#fffdf8" rx="20"/><text x="35" y="44" font-size="22" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">样本空间 Ω（四个等概率结果）</text><text x="680" y="44" font-size="22" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">随机变量 X = 正面个数</text><rect x="44" y="72" width="175" height="52" rx="14" fill="#eef7f6" stroke="#137d83" stroke-width="1.5"/><text x="88" y="106" font-size="20" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">HH</text><rect x="44" y="141" width="175" height="52" rx="14" fill="#eef7f6" stroke="#137d83" stroke-width="1.5"/><text x="88" y="175" font-size="20" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">HT</text><rect x="44" y="210" width="175" height="52" rx="14" fill="#eef7f6" stroke="#137d83" stroke-width="1.5"/><text x="88" y="244" font-size="20" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">TH</text><rect x="44" y="279" width="175" height="52" rx="14" fill="#eef7f6" stroke="#137d83" stroke-width="1.5"/><text x="88" y="313" font-size="20" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">TT</text><rect x="696" y="90" width="180" height="58" rx="14" fill="#f4effa" stroke="#7566b0" stroke-width="1.5"/><text x="768" y="128" font-size="26" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">2</text><rect x="696" y="184" width="180" height="58" rx="14" fill="#f4effa" stroke="#7566b0" stroke-width="1.5"/><text x="768" y="222" font-size="26" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">1</text><rect x="696" y="278" width="180" height="58" rx="14" fill="#f4effa" stroke="#7566b0" stroke-width="1.5"/><text x="768" y="316" font-size="26" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">0</text><line x1="219" y1="98" x2="695" y2="118" stroke="#137d83" stroke-width="2" /><path d="M687 113 L695 118 L687 123" fill="none" stroke="#137d83" stroke-width="2"/><line x1="219" y1="167" x2="695" y2="212" stroke="#d56c4e" stroke-width="2" /><path d="M687 207 L695 212 L687 217" fill="none" stroke="#d56c4e" stroke-width="2"/><line x1="219" y1="236" x2="695" y2="212" stroke="#d56c4e" stroke-width="2" /><path d="M687 207 L695 212 L687 217" fill="none" stroke="#d56c4e" stroke-width="2"/><line x1="219" y1="305" x2="695" y2="306" stroke="#7566b0" stroke-width="2" /><path d="M687 301 L695 306 L687 311" fill="none" stroke="#7566b0" stroke-width="2"/><text x="335" y="166" font-size="17" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">HT 和 TH → 同一个数值 1</text><text x="336" y="353" font-size="18" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">P(X=0)=1/4　 P(X=1)=1/2　 P(X=2)=1/4</text></svg>