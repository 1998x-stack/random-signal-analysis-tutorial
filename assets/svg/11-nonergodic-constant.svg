<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="fig11b-title fig11b-desc"><title id="fig11b-title">随机常数过程平稳但不均值各态历经</title><desc id="fig11b-desc">过程取值是随机常数B，每条样本路径都是水平直线；单条路径的时间平均等于该路径的B，永远不收敛到集合平均，只有把不同路径的常数值平均才得到总体均值。</desc><rect width="1000" height="400" rx="19" fill="#fffdf8"/><text x="28" y="40" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">反例：X(t)=B，B 等概率取 1 与 2</text><line x1="80" y1="330" x2="930" y2="330" stroke="#dce7e6"/><line x1="80" y1="80" x2="80" y2="330" stroke="#dce7e6"/><line x1="80" y1="160" x2="930" y2="160" stroke="#ce704f" stroke-width="3.4"/><line x1="80" y1="230" x2="930" y2="230" stroke="#137f83" stroke-width="3.4"/><line x1="80" y1="278" x2="930" y2="278" stroke="#7564ad" stroke-width="3.4"/><line x1="80" y1="195" x2="930" y2="195" stroke="#20343d" stroke-width="1.6" stroke-dasharray="7 5"/><text x="838" y="152" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ce704f">路径 1：时间平均 = 2</text><text x="838" y="222" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#137f83">路径 2：时间平均 = 2</text><text x="838" y="270" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#7564ad">路径 3：时间平均 = 1</text><text x="88" y="188" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#20343d">集合平均 μ = 1.5</text><text x="80" y="60" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">X(t)</text><text x="910" y="352" text-anchor="end" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">t</text><text x="29" y="390" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">每条路径的时间平均是 B 本身，不随 T→∞ 收敛到 1.5，因此不是均值各态历经的。</text></svg>
