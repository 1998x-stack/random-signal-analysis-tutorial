<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="fig07c-title fig07c-desc"><title id="fig07c-title">零相关不等于独立：Y 完全由 X 决定却互相关为零</title><desc id="fig07c-desc">X 在负一零一上等可能取值，Y 等于 X 的平方。三点落在一条抛物线上，说明 Y 完全由 X 决定；同时期望与互相关计算显示协方差为零。</desc><rect width="1000" height="400" rx="19" fill="#fffdf8"/><text x="28" y="40" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">X 等可能取 −1, 0, 1；令 Y = X²</text><g stroke="#dce7e6" stroke-width="1"><line x1="90" y1="300" x2="520" y2="300"/><line x1="300" y1="70" x2="300" y2="320"/></g><text x="520" y="322" text-anchor="end" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">X</text><text x="288" y="80" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">Y</text><path d="M160 90 Q300 320 440 90" fill="none" stroke="#7564ad" stroke-width="2.4" stroke-dasharray="7 5"/><circle cx="160" cy="90" r="9" fill="#137f83"/><circle cx="300" cy="300" r="9" fill="#137f83"/><circle cx="440" cy="90" r="9" fill="#137f83"/><text x="150" y="74" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#137f83">(−1, 1)</text><text x="286" y="326" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#137f83">(0, 0)</text><text x="420" y="74" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#137f83">(1, 1)</text><text x="560" y="80" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#20343d">E[X] = 0</text><text x="560" y="120" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#20343d">E[Y] = E[X²] = 2/3</text><text x="560" y="160" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#20343d">E[XY] = E[X³] = 0</text><text x="560" y="200" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ce704f">Cov(X,Y) = E[XY] − E[X]E[Y] = 0</text><text x="560" y="250" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#7564ad">但 Y 是 X 的确定函数，</text><text x="560" y="278" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#7564ad">二者显然不独立。</text><text x="29" y="392" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">这组三点分布是“不相关但不独立”的最小反例；仅当联合高斯时零协方差才等价于独立。</text></svg>
