<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="fig13a-title fig13a-desc"><title id="fig13a-title">输出功率谱等于输入功率谱乘以系统幅频响应的平方</title><desc id="fig13a-desc">上方左图是平坦的白噪声输入功率谱，右图是低通幅频响应平方；下方输出功率谱的形状完全由系统幅频响应平方决定。</desc><rect width="1000" height="400" rx="19" fill="#fffdf8"/><text x="28" y="40" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">S_Y(ω) = |H(ω)|² · S_X(ω)：双重卷积变成乘法</text><rect x="40" y="62" width="420" height="150" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="58" y="88" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#137f83">输入 S_X(ω)：白噪声，平坦</text><line x1="70" y1="180" x2="440" y2="180" stroke="#dce7e6"/><line x1="255" y1="100" x2="255" y2="190" stroke="#dce7e6"/><line x1="80" y1="130" x2="430" y2="130" stroke="#137f83" stroke-width="3"/><text x="255" y="204" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5d7078">ω</text><rect x="540" y="62" width="420" height="150" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="558" y="88" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#7564ad">系统 |H(ω)|²：低通</text><line x1="570" y1="180" x2="940" y2="180" stroke="#dce7e6"/><line x1="755" y1="100" x2="755" y2="190" stroke="#dce7e6"/><path d="M580 182 Q680 150 730 128 Q750 122 756 122 Q800 150 870 176 Q910 180 930 181" fill="none" stroke="#7564ad" stroke-width="3"/><text x="755" y="204" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5d7078">ω</text><text x="500" y="150" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#20343d">↓ ×</text><rect x="40" y="230" width="920" height="150" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="58" y="256" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ce704f">输出 S_Y(ω)：形状 = 系统幅频响应的平方</text><line x1="70" y1="350" x2="940" y2="350" stroke="#dce7e6"/><line x1="505" y1="270" x2="505" y2="360" stroke="#dce7e6"/><path d="M80 352 Q350 330 450 292 Q500 274 508 274 Q580 320 780 344 Q880 350 930 351" fill="none" stroke="#ce704f" stroke-width="3"/><text x="505" y="374" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5d7078">ω</text><text x="29" y="392" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">相位信息在 |H|² 中消失；曲线为教学示意，真实形状由具体 H 决定。</text></svg>
