<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="fig10c-title fig10c-desc"><title id="fig10c-title">离散白噪声的方差随采样率线性增长以保持功率谱密度不变</title><desc id="fig10c-desc">左图为单边恒定的功率谱密度；右图中采样率加倍后离散样本方差也加倍，因为每个样本代表的等效带宽更大。</desc><rect width="1000" height="400" rx="19" fill="#fffdf8"/><text x="28" y="40" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">仿真里决定噪声的是 PSD，不是凭感觉设的方差</text><rect x="40" y="62" width="420" height="300" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="60" y="90" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#137f83">连续时间单边谱 S₁(f)=N₀</text><line x1="70" y1="280" x2="440" y2="280" stroke="#dce7e6"/><line x1="255" y1="120" x2="255" y2="292" stroke="#dce7e6"/><line x1="80" y1="180" x2="430" y2="180" stroke="#137f83" stroke-width="3"/><line x1="80" y1="180" x2="80" y2="280" stroke="#137f83" stroke-width="3"/><line x1="430" y1="180" x2="430" y2="280" stroke="#137f83" stroke-width="3"/><text x="255" y="304" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">f，截止 f_s/2</text><text x="255" y="164" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#137f83">白噪声在关注带内近似平坦</text><rect x="520" y="62" width="440" height="300" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="540" y="90" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#20343d">采样后方差 σ² = N₀ · f_s / 2</text><line x1="560" y1="290" x2="940" y2="290" stroke="#dce7e6"/><rect x="620" y="200" width="90" height="90" fill="#d9f0eb" stroke="#137f83" stroke-width="2"/><rect x="790" y="110" width="90" height="180" fill="#fde6dd" stroke="#ce704f" stroke-width="2"/><text x="665" y="188" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#137f83">N₀ f_s / 2</text><text x="835" y="98" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ce704f">2 × (N₀ f_s / 2)</text><text x="665" y="316" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">采样率 f_s</text><text x="835" y="316" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">采样率 2 f_s</text><text x="29" y="392" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">同一 N₀ 下，采样率加倍则离散样本方差加倍；先固定 N₀ 再换算方差才是自洽做法。</text></svg>
