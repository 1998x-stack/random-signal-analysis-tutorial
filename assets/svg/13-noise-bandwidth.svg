<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="fig13b-title fig13b-desc"><title id="fig13b-title">等效噪声带宽等于同面积的矩形宽度，并大于3dB带宽</title><desc id="fig13b-desc">低通幅频响应平方曲线下的面积被一个高度为中心增益的矩形等效替代，该矩形宽度就是等效噪声带宽；它在3dB频率之外，所以比3dB带宽更宽。</desc><rect width="1000" height="400" rx="19" fill="#fffdf8"/><text x="28" y="40" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">等效噪声带宽 B_eq：同面积的矩形，不等于 3dB 带宽</text><line x1="90" y1="320" x2="930" y2="320" stroke="#dce7e6"/><line x1="140" y1="90" x2="140" y2="330" stroke="#dce7e6"/><path d="M140 320 L140 120 Q240 128 320 200 Q420 278 560 300 Q720 312 900 318" fill="none" stroke="#7564ad" stroke-width="3"/><rect x="140" y="120" width="250" height="200" fill="#d9f0eb" fill-opacity="0.45" stroke="#137f83" stroke-width="1.6" stroke-dasharray="6 4"/><line x1="140" y1="120" x2="900" y2="120" stroke="#137f83" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="390" y1="120" x2="390" y2="320" stroke="#137f83" stroke-width="1.6" stroke-dasharray="6 4"/><line x1="252" y1="228" x2="252" y2="320" stroke="#ce704f" stroke-width="2"/><circle cx="252" cy="228" r="4" fill="#ce704f"/><text x="196" y="300" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#137f83">矩形宽度 = B_eq</text><text x="262" y="220" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ce704f">3dB 点</text><text x="140" y="112" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#137f83">|H(0)|²</text><text x="900" y="344" text-anchor="end" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">ω</text><text x="560" y="368" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#7564ad">B_eq / B_3dB 一阶 RC ≈ 1.57；曲线为教学示意</text><text x="29" y="392" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">一阶 RC：B_eq = π/(2RC) rad/s（单边），B_3dB = 1/RC rad/s，故 B_eq 明显更宽。</text></svg>
