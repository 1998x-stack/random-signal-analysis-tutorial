<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="fig11a-title fig11a-desc"><title id="fig11a-title">集合平均在固定时刻纵向取样，时间平均沿单条路径横向取样</title><desc id="fig11a-desc">多个样本路径在固定时刻的取值给出集合平均；其中一条加粗路径沿时间积分给出时间平均。各态历经意味着对几乎每条路径两者相等。</desc><rect width="1000" height="420" rx="19" fill="#fffdf8"/><text x="28" y="40" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">集合平均（纵向切一刀） vs 时间平均（沿一条路径积分）</text><line x1="70" y1="360" x2="940" y2="360" stroke="#dce7e6"/><line x1="70" y1="70" x2="70" y2="360" stroke="#dce7e6"/><g fill="none" stroke-width="2"><path d="M70 150 Q200 120 330 168 Q470 214 600 160 Q740 108 870 150 Q910 162 940 150" stroke="#9dc9c4"/><path d="M70 200 Q200 176 330 214 Q470 250 600 206 Q740 164 870 200 Q910 212 940 202" stroke="#9dc9c4"/><path d="M70 256 Q200 234 330 268 Q470 300 600 260 Q740 224 870 258 Q910 268 940 260" stroke="#9dc9c4"/><path d="M70 300 Q200 284 330 314 Q470 342 600 308 Q740 276 870 306 Q910 314 940 310" stroke="#9dc9c4"/></g><path d="M70 176 Q200 140 330 196 Q470 244 600 182 Q740 128 870 176 Q910 188 940 178" fill="none" stroke="#137f83" stroke-width="3.4"/><line x1="500" y1="70" x2="500" y2="360" stroke="#7564ad" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="500" cy="132" r="5" fill="#7564ad"/><circle cx="500" cy="192" r="5" fill="#7564ad"/><circle cx="500" cy="240" r="5" fill="#7564ad"/><circle cx="500" cy="284" r="5" fill="#7564ad"/><circle cx="500" cy="214" r="6" fill="#137f83"/><text x="508" y="84" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#7564ad">固定 t₀ 纵向取样 → 集合平均 E[X(t₀)]</text><text x="200" y="404" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#137f83">加粗路径沿时间积分 (1/T)∫x(t)dt → 时间平均</text><line x1="640" y1="404" x2="700" y2="404" stroke="#137f83" stroke-width="3.4"/><text x="70" y="60" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">X(t)</text><text x="940" y="60" text-anchor="end" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">t</text><text x="600" y="404" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#137f83">时间平均</text><text x="29" y="392" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">各态历经性断言：对几乎所有样本函数，时间平均等于集合平均。</text></svg>
