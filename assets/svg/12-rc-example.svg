<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="fig12c-title fig12c-desc"><title id="fig12c-title">RC低通滤波器：因果冲激响应与双边指数输出自相关</title><desc id="fig12c-desc">左侧冲激响应在时间零点突然出现后指数衰减、零时刻前为零；右侧白噪声输入下的输出自相关关于零时差对称，在零时差处等于输出平均功率。</desc><rect width="1000" height="400" rx="19" fill="#fffdf8"/><text x="28" y="40" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">RC 低通：h(t)=(1/RC)e^(−t/RC)u(t)，输入为白噪声</text><rect x="40" y="62" width="440" height="300" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="60" y="90" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#137f83">因果冲激响应 h(t)</text><line x1="70" y1="300" x2="450" y2="300" stroke="#dce7e6"/><line x1="180" y1="110" x2="180" y2="312" stroke="#dce7e6"/><line x1="70" y1="300" x2="180" y2="300" stroke="#137f83" stroke-width="3"/><path d="M180 130 Q220 250 280 282 Q360 296 450 299" fill="none" stroke="#137f83" stroke-width="3"/><text x="188" y="126" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#137f83">t=0 起跳，之后指数衰减</text><text x="168" y="322" text-anchor="end" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">t</text><rect x="520" y="62" width="440" height="300" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="540" y="90" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#7564ad">输出自相关 R_Y(τ)=(N₀/4RC)e^(−|τ|/RC)</text><line x1="550" y1="300" x2="940" y2="300" stroke="#dce7e6"/><line x1="745" y1="110" x2="745" y2="312" stroke="#dce7e6"/><path d="M560 298 Q650 294 710 200 Q740 140 745 138 Q770 180 800 270 Q860 296 930 299" fill="none" stroke="#7564ad" stroke-width="3"/><circle cx="745" cy="138" r="4.5" fill="#7564ad"/><text x="754" y="132" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#7564ad">R_Y(0)=N₀/(4RC)=输出平均功率</text><text x="905" y="322" text-anchor="end" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">τ</text><text x="540" y="242" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">关于 τ=0 对称</text><text x="29" y="392" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">曲线为公式直接作图；RC 越大，输出功率越小（更多噪声被滤除），下一章将由 |H(ω)|² 给出同一结果。</text></svg>
