<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="fig14c-title fig14c-desc"><title id="fig14c-title">MA自相关在阶数后截尾，AR自相关无限指数衰减</title><desc id="fig14c-desc">左图MA模型的相关系数在滞后超过q后严格为零；右图AR模型的相关系数按指数规律缓慢衰减，永不截断。</desc><rect width="1000" height="400" rx="19" fill="#fffdf8"/><text x="28" y="40" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">用自相关形状区分 MA 与 AR</text><rect x="40" y="62" width="440" height="290" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="60" y="90" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#137f83">MA(q=2)：R[m]=0，|m|&gt;2</text><line x1="70" y1="240" x2="460" y2="240" stroke="#dce7e6"/><line x1="265" y1="110" x2="265" y2="252" stroke="#dce7e6"/><g stroke="#137f83" stroke-width="5"><line x1="175" y1="240" x2="175" y2="180"/><line x1="220" y1="240" x2="220" y2="205"/><line x1="265" y1="240" x2="265" y2="140"/><line x1="310" y1="240" x2="310" y2="205"/><line x1="355" y1="240" x2="355" y2="180"/></g><circle cx="400" cy="240" r="4" fill="#ce704f"/><circle cx="445" cy="240" r="4" fill="#ce704f"/><text x="415" y="232" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ce704f">严格为零</text><text x="175" y="266" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5d7078">−2</text><text x="265" y="266" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5d7078">0</text><text x="355" y="266" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5d7078">2</text><text x="410" y="266" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5d7078">滞后 m</text><rect x="520" y="62" width="440" height="290" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="540" y="90" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ce704f">AR(p=1)：指数衰减，不截尾</text><line x1="550" y1="240" x2="940" y2="240" stroke="#dce7e6"/><line x1="610" y1="110" x2="610" y2="252" stroke="#dce7e6"/><g stroke="#ce704f" stroke-width="5"><line x1="610" y1="240" x2="610" y2="140"/><line x1="660" y1="240" x2="660" y2="170"/><line x1="710" y1="240" x2="710" y2="198"/><line x1="760" y1="240" x2="760" y2="218"/><line x1="810" y1="240" x2="810" y2="229"/><line x1="860" y1="240" x2="860" y2="235"/><line x1="910" y1="240" x2="910" y2="238"/></g><text x="700" y="266" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5d7078">滞后 m →</text><text x="29" y="384" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">MA 截尾便于用有限项估计；AR 的无限衰减需要 Yule-Walker 递推才能展平。</text></svg>
