<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc"><title id="title">二次抛硬币计数的累积分布函数</title><desc id="desc">阶梯状的右连续CDF：x小于0为0，0到1之间为0.25，1到2之间为0.75，x大于等于2为1。每个跳跃大小等于对应点概率。</desc><rect width="1000" height="380" fill="#fffdf8" rx="20"/><text x="34" y="43" font-size="22" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">Fₓ(x) = P(X ≤ x)：跳跃幅度恰好是 PMF</text><line x1="105" y1="310" x2="855" y2="310" stroke="#223743" stroke-width="2" /><line x1="168" y1="324" x2="168" y2="76" stroke="#223743" stroke-width="2" /><line x1="156" y1="310" x2="837" y2="310" stroke="#e6ebeb" stroke-width="1" /><text x="88" y="316" font-size="15" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">0</text><line x1="156" y1="256.25" x2="837" y2="256.25" stroke="#e6ebeb" stroke-width="1" /><text x="88" y="262.25" font-size="15" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">0.25</text><line x1="156" y1="148.75" x2="837" y2="148.75" stroke="#e6ebeb" stroke-width="1" /><text x="88" y="154.75" font-size="15" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">0.75</text><line x1="156" y1="95" x2="837" y2="95" stroke="#e6ebeb" stroke-width="1" /><text x="88" y="101" font-size="15" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">1</text><path d="M113 310 L277 310 M277 256.25 L470 256.25 M470 148.75 L660 148.75 M660 95 L855 95" fill="none" stroke="#137d83" stroke-width="5" stroke-linecap="round"/><circle cx="277" cy="310" r="7" fill="#fffdf8" stroke="#137d83" stroke-width="3"/><circle cx="277" cy="256.25" r="7" fill="#137d83" stroke="#137d83" stroke-width="3"/><circle cx="470" cy="256.25" r="7" fill="#fffdf8" stroke="#137d83" stroke-width="3"/><circle cx="470" cy="148.75" r="7" fill="#137d83" stroke="#137d83" stroke-width="3"/><circle cx="660" cy="148.75" r="7" fill="#fffdf8" stroke="#137d83" stroke-width="3"/><circle cx="660" cy="95" r="7" fill="#137d83" stroke="#137d83" stroke-width="3"/><text x="271" y="339" font-size="17" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">0</text><text x="465" y="339" font-size="17" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">1</text><text x="655" y="339" font-size="17" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">2</text><text x="862" y="316" font-size="18" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">x</text><text x="308" y="236" font-size="17" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">+0.25</text><text x="500" y="130" font-size="17" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">+0.50</text><text x="690" y="76" font-size="17" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">+0.25</text></svg>