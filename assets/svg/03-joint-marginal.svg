<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc"><title id="title">联合分布到边缘与条件分布</title><desc id="desc">二维离散联合概率表：四格分别是0.4、0.1、0.2、0.3；行和得到P(X=0)=0.5与P(X=1)=0.5，列和得到P(Y=0)=0.6与P(Y=1)=0.4；给定Y=1时P(X=1|Y=1)=0.3/0.4=0.75。</desc><rect width="1000" height="390" fill="#fffdf8" rx="20"/><text x="40" y="44" font-size="22" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">联合概率表 → 行列求和 → 条件概率</text><text x="205" y="95" font-size="18" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">Y = 0</text><text x="407" y="95" font-size="18" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">Y = 1</text><text x="615" y="95" font-size="18" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">行和 P(X)</text><text x="47" y="156" font-size="19" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">X = 0</text><text x="47" y="251" font-size="19" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">X = 1</text><rect x="169" y="112" width="183" height="76" rx="14" fill="#e6f6f3" stroke="#137d83" stroke-width="1.5"/><rect x="374" y="112" width="183" height="76" rx="14" fill="#f0edf8" stroke="#7566b0" stroke-width="1.5"/><rect x="169" y="205" width="183" height="76" rx="14" fill="#e6f6f3" stroke="#137d83" stroke-width="1.5"/><rect x="374" y="205" width="183" height="76" rx="14" fill="#f0edf8" stroke="#7566b0" stroke-width="1.5"/><text x="226" y="160" font-size="27" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">0.40</text><text x="431" y="160" font-size="27" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">0.10</text><text x="226" y="254" font-size="27" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">0.20</text><text x="431" y="254" font-size="27" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">0.30</text><text x="635" y="160" font-size="25" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">0.50</text><text x="635" y="254" font-size="25" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">0.50</text><text x="169" y="315" font-size="16" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">列和 P(Y):</text><text x="255" y="349" font-size="23" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">0.60</text><text x="461" y="349" font-size="23" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">0.40</text><rect x="772" y="120" width="207" height="169" rx="14" fill="#fff0e9" stroke="#d56c4e" stroke-width="1.5"/><text x="788" y="154" font-size="18" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">条件概率</text><text x="788" y="190" font-size="17" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">P(X=1 | Y=1)</text><text x="788" y="222" font-size="17" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">= 0.30 / 0.40</text><text x="788" y="257" font-size="26" font-weight="750" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">= 0.75</text></svg>