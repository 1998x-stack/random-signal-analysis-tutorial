<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">切比雪夫下界和高斯覆盖率是不同承诺</title><desc id="figure-desc">仅知道有限方差时，距均值小于两个标准差的覆盖概率至少为75%；若确实是高斯分布，同一范围覆盖约95.45%。</desc><rect width="1000" height="380" rx="19" fill="#fffdf8"/><text x="38" y="42" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#20343d" font-weight="700">只知道方差，能保证多少观测在 μ ± 2σ 内？</text><text x="58" y="102" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#20343d" >切比雪夫（任意有限方差分布）</text><rect x="58" y="123" width="750" height="55" rx="3" fill="#f2f5f5" stroke="none" stroke-width="1.3"/><rect x="58" y="123" width="562.5" height="55" rx="3" fill="#137f83" stroke="none" stroke-width="1.3"/><text x="834" y="158" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" fill="#137f83" font-weight="700">≥ 75%</text><text x="58" y="234" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#20343d" >高斯分布（额外分布假设）</text><rect x="58" y="254" width="750" height="55" rx="3" fill="#f2f5f5" stroke="none" stroke-width="1.3"/><rect x="58" y="254" width="715.9" height="55" rx="3" fill="#7564ad" stroke="none" stroke-width="1.3"/><text x="831" y="292" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#7564ad" font-weight="700">≈ 95.45%</text><text x="58" y="356" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#5d7078" >同一个阈值 k=2；上方是普适保证，下方是正态模型的精确覆盖率。</text></svg>