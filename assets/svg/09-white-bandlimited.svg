<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="fig09b-title fig09b-desc"><title id="fig09b-title">理想白噪声与带限白噪声的功率谱</title><desc id="fig09b-desc">左图理想白噪声的功率谱在全频带恒为N零/2，其总功率发散，只能作为理想化模型；右图带限白噪声在正负2πB内为常数、带外为零，总功率为N零B，其自相关是sinc函数。</desc><rect width="1000" height="420" rx="19" fill="#fffdf8"/><text x="28" y="40" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">“白”指功率谱平坦，而不是指样本路径白</text><rect x="40" y="62" width="430" height="330" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="60" y="90" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ce704f">理想白噪声（理想化）</text><line x1="70" y1="200" x2="450" y2="200" stroke="#dce7e6"/><line x1="260" y1="120" x2="260" y2="215" stroke="#dce7e6"/><line x1="80" y1="150" x2="440" y2="150" stroke="#ce704f" stroke-width="3"/><text x="300" y="140" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ce704f">S(ω)=N₀/2（全频带）</text><text x="250" y="238" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">ω</text><line x1="90" y1="288" x2="170" y2="288" stroke="#ce704f" stroke-width="3"/><text x="182" y="293" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ce704f">R(τ)=(N₀/2)δ(τ)</text><line x1="90" y1="330" x2="170" y2="330" stroke="#137f83" stroke-width="3"/><text x="182" y="335" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#137f83">E[X²]=(1/2π)∫S dω → 发散</text><rect x="530" y="62" width="430" height="330" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="550" y="90" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#137f83">带限白噪声：|ω|≤2πB</text><line x1="560" y1="200" x2="940" y2="200" stroke="#dce7e6"/><rect x="670" y="150" width="160" height="50" fill="#d9f0eb" stroke="#137f83" stroke-width="2"/><line x1="750" y1="120" x2="750" y2="215" stroke="#dce7e6"/><text x="700" y="140" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#137f83">S=N₀/2，带外为 0</text><text x="750" y="238" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">ω，半带宽 2πB</text><text x="560" y="290" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#137f83">总功率 = N₀B（有限）</text><text x="560" y="322" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#137f83">R(τ)=N₀B·sinc(2πBτ)</text><text x="560" y="354" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">sinc(x)=sin(x)/x</text><text x="29" y="410" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">采样自实际器件的噪声总是带限的；理想白噪声的无限功率只用于近似带内平坦的窄带噪声。</text></svg>
