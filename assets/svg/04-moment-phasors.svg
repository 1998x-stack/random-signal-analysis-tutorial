<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 385" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">特征函数通过复平面向量求概率平均</title><desc id="figure-desc">对X等概率取正一与负一，e的itX有上下对称的两个单位向量；相加除以2后虚部相消，特征函数为cos(t)。</desc><rect width="1000" height="385" rx="19" fill="#fffdf8"/><text x="32" y="41" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#20343d" font-weight="700">X = ±1，各占 1/2；φX(t) = E[eⁱᵗˣ] = cos(t)</text><rect x="32" y="68" width="600" height="270" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><line x1="107" y1="203" x2="571" y2="203" stroke="#e1eaea" stroke-width="2" /><line x1="333" y1="315" x2="333" y2="100" stroke="#e1eaea" stroke-width="2" /><circle cx="333" cy="203" r="96" fill="none" stroke="#e1eaea" stroke-width="2"/><path d="M333 203 L400 134" stroke="#137f83" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M333 203 L400 272" stroke="#ce704f" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M333 203 L400 203" stroke="#7564ad" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="408" y="130" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#137f83" >eⁱᵗ</text><text x="408" y="289" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#ce704f" >e⁻ⁱᵗ</text><text x="406" y="192" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#7564ad" >cos(t)</text><rect x="659" y="86" width="313" height="219" rx="12" fill="#ebf6f3" stroke="#137f83" stroke-width="1.3"/><text x="679" y="124" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#20343d" font-weight="700">实部相同，虚部抵消</text><text x="679" y="161" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#20343d" >φX(t) = ½ eⁱᵗ + ½ e⁻ⁱᵗ</text><text x="679" y="209" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" fill="#137f83" font-weight="700">= cos(t)</text><text x="679" y="258" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#5d7078" >特征函数总存在</text><text x="32" y="365" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#5d7078" >图中向量仅示意某个 0 &lt; t &lt; π/2 的相位，长度无单位。</text></svg>