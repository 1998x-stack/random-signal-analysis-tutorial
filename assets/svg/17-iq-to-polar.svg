<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="fig17a-title fig17a-desc">
<title id="fig17a-title">圆对称的同相正交平面到包络相位的极坐标变换</title>
<desc id="fig17a-desc">左panel是I与Q各自的零均值等方差高斯密度，右panel是(I,Q)平面上的圆对称等高线与一点，其到原点的距离为包络R，与横轴夹角为相位Φ。</desc>
<rect width="1000" height="400" rx="19" fill="#fffdf8"/>
<text x="28" y="41" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">I、Q 独立同分布高斯 ⟹ 圆对称 ⟹ (R,Φ) 可用极坐标</text>
<g font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<line x1="50" y1="300" x2="410" y2="300" stroke="#dce7e6"/>
<path d="M110 300 Q150 150 190 300" fill="none" stroke="#137f83" stroke-width="2.6"/>
<path d="M250 300 Q290 150 330 300" fill="none" stroke="#7564ad" stroke-width="2.6"/>
<text x="190" y="330" font-size="13" fill="#137f83" text-anchor="middle">I ~ N(0,σ²)</text>
<text x="330" y="330" font-size="13" fill="#524a86" text-anchor="middle">Q ~ N(0,σ²)</text>
<text x="230" y="120" font-size="13" fill="#5d7078" text-anchor="middle">等方差、不相关</text>
</g>
<g>
<line x1="560" y1="230" x2="900" y2="230" stroke="#dce7e6"/>
<line x1="730" y1="70" x2="730" y2="350" stroke="#dce7e6"/>
<circle cx="730" cy="230" r="40" fill="none" stroke="#7564ad" stroke-width="1.4" opacity="0.7"/>
<circle cx="730" cy="230" r="75" fill="none" stroke="#7564ad" stroke-width="1.3" opacity="0.5"/>
<circle cx="730" cy="230" r="105" fill="none" stroke="#7564ad" stroke-width="1.2" opacity="0.35"/>
<circle cx="730" cy="230" r="3.2" fill="#7564ad"/>
<line x1="730" y1="230" x2="838" y2="150" stroke="#137f83" stroke-width="3"/>
<circle cx="838" cy="150" r="5.5" fill="#137f83"/>
<path d="M780 230 A50 50 0 0 0 795 200" fill="none" stroke="#ce704f" stroke-width="2.2"/>
<text x="806" y="205" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#a04a2e">Φ</text>
<text x="800" y="180" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#137f83">R=√(I²+Q²)</text>
<text x="730" y="372" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5d7078" text-anchor="middle">(I,Q) 联合密度：圆对称，无特殊方向</text>
</g>
</svg>
