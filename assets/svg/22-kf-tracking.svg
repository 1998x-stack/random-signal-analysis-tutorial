<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="fig22b-title fig22b-desc">
<title id="fig22b-title">卡尔曼滤波在含噪测量中估计真实位置</title>
<desc id="fig22b-desc">一条平滑的真实位置曲线、散布其周围的含噪测量点、以及卡尔曼滤波估计曲线；估计曲线比测量平滑，并能抑制起始处的离群测量。</desc>
<rect width="1000" height="400" rx="19" fill="#fffdf8"/>
<text x="28" y="41" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">真实轨迹 / 含噪测量 / 卡尔曼估计（一次实际运行）</text>
<line x1="90" y1="320" x2="880" y2="320" stroke="#dce7e6"/>
<line x1="90" y1="55" x2="90" y2="330" stroke="#dce7e6"/>
