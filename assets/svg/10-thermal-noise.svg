<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="fig10b-title fig10b-desc"><title id="fig10b-title">电阻热噪声由奈奎斯特公式给出，并可折算为噪声温度</title><desc id="fig10b-desc">左侧是电阻串联一个等效噪声电压源的模型，右侧给出均方电压公式与室温千欧电阻的电压密度，以及级联噪声温度的弗里斯公式。</desc><rect width="1000" height="400" rx="19" fill="#fffdf8"/><text x="28" y="40" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">热噪声（Johnson–Nyquist）：电阻串等效噪声电压源</text><rect x="40" y="62" width="460" height="300" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><line x1="70" y1="160" x2="150" y2="160" stroke="#20343d" stroke-width="2.2"/><path d="M150 160 L162 142 L174 178 L186 142 L198 178 L210 142 L222 178 L234 160 L246 160" fill="none" stroke="#137f83" stroke-width="2.4"/><text x="192" y="204" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#137f83">R，温度 T</text><line x1="246" y1="160" x2="310" y2="160" stroke="#20343d" stroke-width="2.2"/><circle cx="360" cy="160" r="34" fill="#fde6dd" stroke="#ce704f" stroke-width="2.2"/><line x1="342" y1="146" x2="378" y2="174" stroke="#ce704f" stroke-width="2"/><line x1="342" y1="174" x2="378" y2="146" stroke="#ce704f" stroke-width="2"/><text x="360" y="222" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ce704f">等效 V (t)</text><line x1="394" y1="160" x2="440" y2="160" stroke="#20343d" stroke-width="2.2"/><line x1="70" y1="160" x2="70" y2="270" stroke="#20343d" stroke-width="1.4" stroke-dasharray="4 4"/><line x1="440" y1="160" x2="440" y2="270" stroke="#20343d" stroke-width="1.4" stroke-dasharray="4 4"/><line x1="70" y1="270" x2="440" y2="270" stroke="#20343d" stroke-width="1.4" stroke-dasharray="4 4"/><text x="255" y="296" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">可用噪声功率 = k<sub>B</sub>TB（匹配负载）</text><rect x="520" y="62" width="440" height="300" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="544" y="94" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#137f83">V² = 4 k_B T R B（单边）</text><text x="544" y="124" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">k_B = 1.380649×10⁻²³ J/K（SI 定义值）</text><text x="544" y="156" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">T=290 K、R=1 kΩ → 4k_BTR ≈ 1.6×10⁻¹⁷ V²/Hz</text><text x="544" y="186" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#137f83">电压密度 √(4k_BTR) ≈ 4 nV/√Hz</text><line x1="544" y1="208" x2="944" y2="208" stroke="#e1eaea"/><text x="544" y="236" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#7564ad">级联噪声温度（Friis）</text><text x="544" y="266" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#7564ad">T_total = T₁ + T₂/G₁ + T₃/(G₁G₂) + …</text><text x="544" y="296" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">第一级的 T 与 G 对总噪声贡献最大。</text><text x="29" y="392" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">上式在 k_B T ≪ h f 的经典近似下成立；极低温或极高频需量子修正。</text></svg>
