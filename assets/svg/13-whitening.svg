<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="fig13c-title fig13c-desc"><title id="fig13c-title">噪声整形与白化是互逆的滤波操作</title><desc id="fig13c-desc">上行把平坦白噪声通过成形滤波器得到目标有色谱，下行把有色噪声通过幅度为根号下功率谱倒数的白化滤波器恢复为平坦白噪声。</desc><rect width="1000" height="400" rx="19" fill="#fffdf8"/><text x="28" y="40" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">整形（白→有色）与白化（有色→白）互为逆操作</text><text x="60" y="82" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#137f83">整形</text><line x1="120" y1="130" x2="310" y2="130" stroke="#dce7e6"/><line x1="120" y1="60" x2="310" y2="60" stroke="#137f83" stroke-width="3"/><text x="215" y="150" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5d7078">平坦（白）</text><rect x="380" y="70" width="240" height="60" rx="9" fill="#eef7f4" stroke="#137f83" stroke-width="1.8"/><text x="500" y="108" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#137f83">|H_shape|²=S_target/(N₀/2)</text><line x1="310" y1="100" x2="380" y2="100" stroke="#20343d" stroke-width="2"/><polygon points="380,100 370,95 370,105" fill="#20343d"/><line x1="620" y1="100" x2="690" y2="100" stroke="#20343d" stroke-width="2"/><polygon points="690,100 680,95 680,105" fill="#20343d"/><line x1="700" y1="150" x2="890" y2="150" stroke="#dce7e6"/><path d="M700 130 Q740 66 800 90 Q850 112 890 138" fill="none" stroke="#ce704f" stroke-width="3"/><text x="795" y="168" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5d7078">目标有色谱</text><text x="60" y="252" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ce704f">白化</text><line x1="120" y1="300" x2="310" y2="300" stroke="#dce7e6"/><path d="M120 280 Q160 220 220 244 Q270 266 310 290" fill="none" stroke="#ce704f" stroke-width="3"/><text x="215" y="320" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5d7078">有色</text><rect x="380" y="240" width="240" height="60" rx="9" fill="#fde6dd" stroke="#ce704f" stroke-width="1.8"/><text x="500" y="278" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ce704f">|H_w|=1/√S_X(ω)</text><line x1="310" y1="270" x2="380" y2="270" stroke="#20343d" stroke-width="2"/><polygon points="380,270 370,265 370,275" fill="#20343d"/><line x1="620" y1="270" x2="690" y2="270" stroke="#20343d" stroke-width="2"/><polygon points="690,270 680,265 680,275" fill="#20343d"/><line x1="700" y1="330" x2="890" y2="330" stroke="#dce7e6"/><line x1="700" y1="290" x2="890" y2="290" stroke="#137f83" stroke-width="3"/><text x="795" y="348" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5d7078">恢复为平坦（白）</text><text x="29" y="392" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">|H_w|=1/√S_X 给出的是幅度；因果可实现的白化还需谱分解（维纳），第 21 章展开。</text></svg>
