<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="fig10a-title fig10a-desc"><title id="fig10a-title">噪声的颜色由功率谱随频率的幂次决定</title><desc id="fig10a-desc">双对数坐标下，白噪声谱平坦，粉红噪声按频率负一次方下降，布朗噪声按负二次方下降，蓝噪声随频率上升。</desc><rect width="1000" height="400" rx="19" fill="#fffdf8"/><text x="28" y="40" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">“颜色”= 功率谱随频率的幂次（双对数坐标）</text><line x1="80" y1="330" x2="600" y2="330" stroke="#dce7e6"/><line x1="80" y1="90" x2="80" y2="330" stroke="#dce7e6"/><text x="590" y="352" text-anchor="end" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">log f →</text><text x="70" y="100" text-anchor="end" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">log S</text><line x1="80" y1="180" x2="600" y2="180" stroke="#137f83" stroke-width="3"/><line x1="80" y1="120" x2="600" y2="310" stroke="#ce704f" stroke-width="3"/><line x1="80" y1="100" x2="520" y2="330" stroke="#7564ad" stroke-width="3"/><line x1="80" y1="310" x2="600" y2="150" stroke="#20343d" stroke-width="3"/><rect x="640" y="90" width="320" height="250" rx="10" fill="#fff" stroke="#e1eaea"/><line x1="662" y1="122" x2="702" y2="122" stroke="#137f83" stroke-width="3"/><text x="712" y="127" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#20343d">白噪声 S∝f⁰（平坦）</text><line x1="662" y1="162" x2="702" y2="162" stroke="#ce704f" stroke-width="3"/><text x="712" y="167" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#20343d">粉红噪声 S∝1/f</text><line x1="662" y1="202" x2="702" y2="202" stroke="#7564ad" stroke-width="3"/><text x="712" y="207" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#20343d">布朗噪声 S∝1/f²</text><line x1="662" y1="242" x2="702" y2="242" stroke="#20343d" stroke-width="3"/><text x="712" y="247" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#20343d">蓝噪声 S∝f</text><text x="662" y="292" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">斜率即幂次的示意；</text><text x="662" y="316" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">1/f 噪声无统一物理模型。</text><text x="29" y="392" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">理想白噪声功率谱平坦，实际器件只能在有限频带内近似平坦。</text></svg>
