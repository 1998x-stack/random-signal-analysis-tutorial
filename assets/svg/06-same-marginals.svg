" >+</text><rect x="457" y="303" width="34" height="31" rx="4" fill="#fde6dd" stroke="#ce704f" stroke-width="1.3"/><text x="468" y="324" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#20343d" >−</text><rect x="503" y="257" width="34" height="31" rx="4" fill="#d9f0eb" stroke="#137f83" stroke-width="1.3"/><text x="514" y="278" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#20343d" >+</text><rect x="549" y="303" width="34" height="31" rx="4" fill="#fde6dd" stroke="#ce704f" stroke-width="1.3"/><text x="560" y="324" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#20343d" >−</text><text x="633" y="304" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#7564ad" >R_B[k] = 𝟙{k=0}</text><text x="29" y="373" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#5d7078" >所展示的是示意样本路径；两个过程的边缘分布完全相同。</text></svg>