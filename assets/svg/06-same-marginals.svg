<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 389" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">相同的一阶分布不代表相同的时间依赖</title><desc id="figure-desc">上方一条样本序列在所有时间都等于同一个随机符号B；下方独立符号序列每个时刻独立抽样。两者每个时刻均为正负一各占二分之一，但非零时滞相关不同。</desc><rect width="1000" height="389" rx="19" fill="#fffdf8"/><text x="28" y="40" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">两种序列的每个时刻：P(Xₙ=±1)=1/2</text><rect x="26" y="65" width="947" height="132" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="43" y="92" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#137f83" >过程 A：抽一个 B，以后始终保持不变</text><rect x="43" y="111" width="34" height="31" rx="4" fill="#d9f0eb" stroke="#137f83" stroke-width="1.3"/><text x="54" y="132" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#20343d" >+</text><rect x="89" y="111" width="34" height="31" rx="4" fill="#d9f0eb" stroke="#137f83" stroke-width="1.3"/><text x="100" y="132" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#20343d" >+</text><rect x="135" y="111" width="34" height="31" rx="4" fill="#d9f0eb" stroke="#137f83" stroke-width="1.3"/><text x="146" y="132" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#20343d" >+</text><rect x="181" y="111" width="34" height="31" rx="4" fill="#d9f0eb" stroke="#137f83" stroke-width="1.3"/><text x="192" y="132" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#20343d" >+</text><rect x="227" y="111" width="34" height="31" rx="4" fill="#d9f0eb" stroke="#137f83" stroke-width="1.3"/><text x="238" y="132" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#20343d" >+</text><rect x="273" y="111" width="34" height="31" rx="4" fill="#d9f0eb" stroke="#137f83" stroke-width="1.3"/><text x="284" y="132" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#20343d" >+</text><rect x="319" y="111" width="34" height="31" rx="4" fill="#d9f0eb" stroke="#137f83" stroke-width="1.3"/><text x="330" y="132" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#20343d" >+</text><rect x="365" y="111" width="34" height="31" rx="4" fill="#d9f0eb" stroke="#137f83" stroke-width="1.3"/><text x="376" y="132" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#20343d" >+</text><rect x="411" y="111" width="34" height="31" rx="4" fill="#d9f0eb" stroke="#137f83" stroke-width="1.3"/><text x="422" y="132" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#20343d" >+</text><rect x="457" y="111" width="34" height="31" rx="4" fill="#d9f0eb" stroke="#137f83" stroke-width="1.3"/><text x="468" y="132" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#20343d" >+</text><rect x="503" y="111" width="34" height="31" rx="4" fill="#d9f0eb" stroke="#137f83" stroke-width="1.3"/><text x="514" y="132" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#20343d" >+</text><rect x="549" y="111" width="34" height="31" rx="4" fill="#d9f0eb" stroke="#137f83" stroke-width="1.3"/><text x="560" y="132" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#20343d" >+</text><text x="633" y="156" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#137f83" >R_A[k] = 1（所有 k）</text><rect x="26" y="210" width="947" height="137" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="43" y="238" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#7564ad" >过程 B：每个时刻重新独立抽样</text><rect x="43" y="257" width="34" height="31" rx="4" fill="#d9f0eb" stroke="#137f83" 