<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc"><title id="title">概率密度的面积，不是曲线高度</title><desc id="desc">均匀分布U(0,2)在0到2的PDF高度为0.5；从0.5到1.5的面积为宽度1乘高度0.5，概率等于0.5。</desc><rect width="1000" height="380" fill="#fffdf8" rx="20"/><text x="36" y="44" font-size="22" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">X ~ Uniform(0,2)：密度是高度，概率是面积</text><line x1="105" y1="311" x2="883" y2="311" stroke="#223743" stroke-width="2" /><line x1="177" y1="321" x2="177" y2="89" stroke="#223743" stroke-width="2" /><rect x="177" y="143" width="630" height="168" rx="0" fill="#f5faf9" stroke="none" stroke-width="1.5"/><rect x="334.5" y="143" width="315" height="168" rx="0" fill="#c4e7e1" stroke="none" stroke-width="1.5"/><path d="M135 311 H177 V143 H807 V311 H870" fill="none" stroke="#137d83" stroke-width="4"/><line x1="334.5" y1="143" x2="334.5" y2="311" stroke="#d56c4e" stroke-width="2" stroke-dasharray="6 5"/><line x1="649.5" y1="143" x2="649.5" y2="311" stroke="#d56c4e" stroke-width="2" stroke-dasharray="6 5"/><text x="166" y="341" font-size="17" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">0</text><text x="325" y="341" font-size="17" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">0.5</text><text x="640" y="341" font-size="17" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">1.5</text><text x="799" y="341" font-size="17" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">2</text><text x="111" y="150" font-size="17" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">0.5</text><text x="384" y="236" font-size="23" font-weight="750" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">面积 = 1 × 0.5 = 0.5</text><text x="705" y="113" font-size="18" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">f(x) = 0.5</text></svg>