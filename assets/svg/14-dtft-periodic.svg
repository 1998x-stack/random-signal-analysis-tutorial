<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="fig14a-title fig14a-desc"><title id="fig14a-title">离散时间功率谱以2π为周期，归一化频率对应物理频率</title><desc id="fig14a-desc">功率谱在归一化角频率轴上以二π为周期重复，主周期区间为负π到正π；归一化频率π对应物理频率的二分之一采样率。</desc><rect width="1000" height="400" rx="19" fill="#fffdf8"/><text x="28" y="40" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">DTFT 是周期为 2π 的周期函数</text><line x1="70" y1="280" x2="940" y2="280" stroke="#dce7e6"/><line x1="500" y1="90" x2="500" y2="300" stroke="#dce7e6"/><g fill="none" stroke="#9dc9c4" stroke-width="2.2"><path d="M70 262 Q160 232 250 250 Q340 268 430 258"/><path d="M570 258 Q660 268 750 250 Q840 232 930 262"/></g><path d="M140 270 Q230 236 320 258 Q410 280 470 266" fill="none" stroke="#137f83" stroke-width="3.2"/><path d="M470 266 Q530 254 570 244 Q660 220 750 244 Q840 266 860 272" fill="none" stroke="#137f83" stroke-width="2.4" opacity="0.55"/><rect x="200" y="100" width="330" height="180" fill="#eef7f4" opacity="0.45" stroke="none"/><line x1="200" y1="100" x2="200" y2="288" stroke="#137f83" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="530" y1="100" x2="530" y2="288" stroke="#137f83" stroke-width="1.2" stroke-dasharray="5 4"/><text x="200" y="304" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#137f83">−π</text><text x="500" y="304" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#137f83">0</text><text x="530" y="304" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#137f83">π</text><text x="360" y="120" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#137f83">主周期 [−π, π]</text><text x="750" y="120" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">周期性重复</text><text x="500" y="336" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">归一化角频率 ω（rad/sample）</text><text x="29" y="384" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">换算：ω = 2π f / f_s；ω = π 对应奈奎斯特频率 f_s/2，超出主周期会与低频混叠。</text></svg>
