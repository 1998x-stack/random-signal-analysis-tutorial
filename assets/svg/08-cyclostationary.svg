<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="fig08c-title fig08c-desc"><title id="fig08c-title">循环平稳：统计特性以周期T重复，同步分帧后恢复平稳</title><desc id="fig08c-desc">上方一段符号速率固定的调制信号，其方差包络每隔T重复一次，因此整体不平稳；下方把相邻的T长片段对齐叠加，得到统计规律一致的片段，这一步对应接收机中的符号同步。</desc><rect width="1000" height="400" rx="19" fill="#fffdf8"/><text x="28" y="40" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">循环平稳信号：R(t₁+T, t₂+T)=R(t₁, t₂)</text><rect x="40" y="60" width="920" height="150" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="58" y="86" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#137f83">原始信号：统计结构以 T 为周期重复</text><line x1="70" y1="160" x2="930" y2="160" stroke="#dce7e6"/><g stroke="#ce704f" stroke-width="1.2" stroke-dasharray="4 4"><line x1="170" y1="100" x2="170" y2="196"/><line x1="450" y1="100" x2="450" y2="196"/><line x1="730" y1="100" x2="730" y2="196"/></g><path d="M70 160 L110 120 L150 190 L190 122 L230 188 L270 124 L310 186 L350 126 L390 184 L430 128 L470 182 L510 130 L550 180 L590 132 L630 178 L670 134 L710 176 L750 136 L790 174 L830 138 L870 172 L910 140 L930 156" fill="none" stroke="#137f83" stroke-width="2.2"/><text x="170" y="214" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ce704f">T</text><text x="450" y="214" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ce704f">2T</text><text x="730" y="214" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ce704f">3T</text><rect x="40" y="230" width="920" height="140" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="58" y="256" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#7564ad">对齐后的 T 长片段：片段内统计规律一致</text><rect x="80" y="274" width="240" height="74" rx="8" fill="#f4f1fa" stroke="#7564ad" stroke-width="1.3"/><rect x="360" y="274" width="240" height="74" rx="8" fill="#f4f1fa" stroke="#7564ad" stroke-width="1.3"/><rect x="640" y="274" width="240" height="74" rx="8" fill="#f4f1fa" stroke="#7564ad" stroke-width="1.3"/><path d="M80 320 Q110 294 140 322 Q170 348 200 316 Q230 292 260 320 Q290 344 320 318" fill="none" stroke="#7564ad" stroke-width="2.2"/><path d="M360 320 Q390 294 420 322 Q450 348 480 316 Q510 292 540 320 Q570 344 600 318" fill="none" stroke="#7564ad" stroke-width="2.2"/><path d="M640 320 Q670 294 700 322 Q730 348 760 316 Q790 292 820 320 Q850 344 880 318" fill="none" stroke="#7564ad" stroke-width="2.2"/><text x="29" y="392" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">波形为教学示意；关键的数学条件只是均值与自相关相对时间偏移 T 不变。</text></svg>
