<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 385" role="img" aria-labelledby="title desc"><title id="title">雷达告警的贝叶斯树</title><desc id="desc">一万次独立观测的期望计数：目标100次、无目标9900次；目标时90%报警产生90个真报警，无目标时5%误报产生495个假报警；报警后目标概率约15.38%。</desc><rect width="1000" height="385" fill="#fffdf8" rx="20"/><text x="34" y="40" font-size="22" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">10,000 次观测（期望计数）</text><rect x="28" y="132" width="170" height="74" rx="14" fill="#e7f4f2" stroke="#137d83" stroke-width="1.5"/><text x="48" y="161" font-size="20" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">观测 10,000</text><text x="48" y="187" font-size="16" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">P(目标)=1%</text><line x1="198" y1="168" x2="280" y2="100" stroke="#137d83" stroke-width="2" /><path d="M272 95 L280 100 L272 105" fill="none" stroke="#137d83" stroke-width="2"/><line x1="198" y1="168" x2="280" y2="261" stroke="#d56c4e" stroke-width="2" /><path d="M272 256 L280 261 L272 266" fill="none" stroke="#d56c4e" stroke-width="2"/><rect x="280" y="64" width="222" height="82" rx="14" fill="#edf8f6" stroke="#137d83" stroke-width="1.5"/><rect x="280" y="224" width="222" height="82" rx="14" fill="#fff1eb" stroke="#d56c4e" stroke-width="1.5"/><text x="300" y="96" font-size="20" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">有目标：100</text><text x="300" y="123" font-size="16" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">先验概率 0.01</text><text x="300" y="256" font-size="20" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">无目标：9,900</text><text x="300" y="283" font-size="16" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">先验概率 0.99</text><line x1="502" y1="104" x2="576" y2="74" stroke="#137d83" stroke-width="2" /><path d="M568 69 L576 74 L568 79" fill="none" stroke="#137d83" stroke-width="2"/><line x1="502" y1="104" x2="576" y2="161" stroke="#596c75" stroke-width="2" /><path d="M568 156 L576 161 L568 166" fill="none" stroke="#596c75" stroke-width="2"/><line x1="502" y1="266" x2="576" y2="242" stroke="#d56c4e" stroke-width="2" /><path d="M568 237 L576 242 L568 247" fill="none" stroke="#d56c4e" stroke-width="2"/><line x1="502" y1="266" x2="576" y2="326" stroke="#596c75" stroke-width="2" /><path d="M568 321 L576 326 L568 331" fill="none" stroke="#596c75" stroke-width="2"/><rect x="576" y="42" width="186" height="63" rx="14" fill="#dff3ed" stroke="#137d83" stroke-width="1.5"/><rect x="576" y="127" width="186" height="62" rx="14" fill="#fff" stroke="#d8e3e3" stroke-width="1.5"/><rect x="576" y="211" width="186" height="62" rx="14" fill="#fff0e9" stroke="#d56c4e" stroke-width="1.5"/><rect x="576" y="298" width="186" height="62" rx="14" fill="#fff" stroke="#d8e3e3" stroke-width="1.5"/><text x="593" y="68" font-size="18" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">真报警：90</text><text x="593" y="90" font-size="15" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">灵敏度 90%</text><text x="593" y="152" font-size="18" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">漏报：10</text><text x="593" y="174" font-size="15" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">漏报率 10%</text><text x="593" y="237" font-size="18" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">假报警：495</text><text x="593" y="259" font-size="15" font-fami