<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="fig12b-title fig12b-desc"><title id="fig12b-title">互相关过一次系统，输出自相关过两次</title><desc id="fig12b-desc">上行中自相关只卷积一次h得到互相关；下行中自相关依次卷积h与h负τ得到输出自相关。把自相关当成只过一次会漏掉一半功率。</desc><rect width="1000" height="400" rx="19" fill="#fffdf8"/><text x="28" y="40" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">R_Y 与 R_XY 差在“过几次系统”</text><rect x="60" y="80" width="120" height="60" rx="8" fill="#eef7f4" stroke="#137f83" stroke-width="1.6"/><text x="120" y="116" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#137f83">R_X(τ)</text><line x1="180" y1="110" x2="300" y2="110" stroke="#20343d" stroke-width="2.2"/><polygon points="300,110 290,105 290,115" fill="#20343d"/><rect x="300" y="80" width="120" height="60" rx="8" fill="#d9f0eb" stroke="#137f83" stroke-width="1.6"/><text x="360" y="116" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#137f83">∗ h</text><line x1="420" y1="110" x2="540" y2="110" stroke="#20343d" stroke-width="2.2"/><polygon points="540,110 530,105 530,115" fill="#20343d"/><rect x="540" y="80" width="140" height="60" rx="8" fill="#f4f1fa" stroke="#7564ad" stroke-width="1.6"/><text x="610" y="116" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#7564ad">R_XY(τ)</text><text x="700" y="116" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">互相关：一次</text><rect x="60" y="210" width="120" height="60" rx="8" fill="#eef7f4" stroke="#137f83" stroke-width="1.6"/><text x="120" y="246" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#137f83">R_X(τ)</text><line x1="180" y1="240" x2="280" y2="240" stroke="#20343d" stroke-width="2.2"/><polygon points="280,240 270,235 270,245" fill="#20343d"/><rect x="280" y="210" width="110" height="60" rx="8" fill="#d9f0eb" stroke="#137f83" stroke-width="1.6"/><text x="335" y="246" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#137f83">∗ h</text><line x1="390" y1="240" x2="490" y2="240" stroke="#20343d" stroke-width="2.2"/><polygon points="490,240 480,235 480,245" fill="#20343d"/><rect x="490" y="210" width="130" height="60" rx="8" fill="#fde6dd" stroke="#ce704f" stroke-width="1.6"/><text x="555" y="246" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ce704f">∗ h(−τ)</text><line x1="620" y1="240" x2="740" y2="240" stroke="#20343d" stroke-width="2.2"/><polygon points="740,240 730,235 730,245" fill="#20343d"/><rect x="740" y="210" width="140" height="60" rx="8" fill="#f4f1fa" stroke="#7564ad" stroke-width="1.6"/><text x="810" y="246" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#7564ad">R_Y(τ)</text><text x="900" y="246" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ce704f">两次</text><text x="60" y="320" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#20343d">等等效系统：ϕ_h(τ)=h(τ)∗h(−τ)，于是 R_Y = R_X ∗ ϕ_h。</text><text x="29" y="390" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">漏掉第二次卷积得到的是互相关而非输出功率；例如 RC 例中 R_XY(0)=(N₀/2)h(0)=N₀/(2RC)，是真实输出功率 N₀/(4RC) 的两倍。</text></svg>
