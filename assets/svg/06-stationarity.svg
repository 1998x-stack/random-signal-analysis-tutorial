<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 389" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">平稳与非平稳过程的方差比较</title><desc id="figure-desc">左图宽平稳随机相位正弦过程在任意时刻方差常数A平方除以2，右图X(t)=tZ其中Z取正负一等概率，均值为零但方差t平方随时间增加，因此不是宽平稳。</desc><rect width="1000" height="389" rx="19" fill="#fffdf8"/><text x="32" y="42" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#20343d" font-weight="700">均值都为 0，也不能据此判断宽平稳</text><rect x="26" y="64" width="461" height="287" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><rect x="514" y="64" width="461" height="287" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="43" y="98" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#137f83" font-weight="700">随机相位正弦（WSS）</text><text x="534" y="98" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#ce704f" font-weight="700">X(t)=tZ，Z=±1（非 WSS）</text><line x1="76" y1="294" x2="448" y2="294" stroke="#20343d" stroke-width="2" /><line x1="76" y1="294" x2="76" y2="121" stroke="#20343d" stroke-width="2" /><line x1="557" y1="294" x2="929" y2="294" stroke="#20343d" stroke-width="2" /><line x1="557" y1="294" x2="557" y2="121" stroke="#20343d" stroke-width="2" /><path d="M84 199 L447 199" stroke="#137f83" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M560.0 293.0 L563.6 293.0 L567.1 292.9 L570.7 292.9 L574.2 292.7 L577.8 292.6 L581.3 292.4 L584.9 292.2 L588.4 292.0 L592.0 291.7 L595.6 291.4 L599.1 291.0 L602.7 290.6 L606.2 290.2 L609.8 289.8 L613.3 289.3 L616.9 288.8 L620.4 288.3 L624.0 287.7 L627.6 287.1 L631.1 286.5 L634.7 285.8 L638.2 285.1 L641.8 284.4 L645.3 283.6 L648.9 282.8 L652.4 282.0 L656.0 281.1 L659.6 280.2 L663.1 279.3 L666.7 278.3 L670.2 277.3 L673.8 276.3 L677.3 275.2 L680.9 274.1 L684.4 273.0 L688.0 271.8 L691.6 270.7 L695.1 269.4 L698.7 268.2 L702.2 266.9 L705.8 265.6 L709.3 264.