<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="fig08b-title fig08b-desc"><title id="fig08b-title">宽平稳但不严平稳：不同时刻的边缘分布不同</title><desc id="fig08b-desc">左图为时刻n等于零时X取值正负一的二点分布，右图为时刻n等于一时取四个不同值的分布。两图均值都是零、方差都是一，所以二阶矩平稳，但边缘分布不同，因此不是严平稳。</desc><rect width="1000" height="400" rx="19" fill="#fffdf8"/><text x="28" y="40" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">Xₙ = A·cos(nθ) + B·sin(nθ)，θ=60°，A、B 独立等概率取 ±1</text><rect x="40" y="60" width="440" height="290" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="60" y="90" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#137f83">n = 0：X₀ = A，两点分布</text><line x1="80" y1="300" x2="450" y2="300" stroke="#dce7e6"/><line x1="265" y1="110" x2="265" y2="310" stroke="#dce7e6"/><line x1="150" y1="300" x2="150" y2="150" stroke="#137f83" stroke-width="6"/><line x1="380" y1="300" x2="380" y2="150" stroke="#137f83" stroke-width="6"/><text x="150" y="132" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#137f83">1/2</text><text x="380" y="132" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#137f83">1/2</text><text x="150" y="326" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">−1.000</text><text x="380" y="326" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">+1.000</text><rect x="520" y="60" width="440" height="290" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="540" y="90" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#7564ad">n = 1：X₁ 取四点分布</text><line x1="560" y1="300" x2="930" y2="300" stroke="#dce7e6"/><line x1="745" y1="110" x2="745" y2="310" stroke="#dce7e6"/><line x1="640" y1="300" x2="640" y2="200" stroke="#7564ad" stroke-width="6"/><line x1="710" y1="300" x2="710" y2="200" stroke="#7564ad" stroke-width="6"/><line x1="780" y1="300" x2="780" y2="200" stroke="#7564ad" stroke-width="6"/><line x1="850" y1="300" x2="850" y2="200" stroke="#7564ad" stroke-width="6"/><text x="640" y="330" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5d7078">−1.366</text><text x="710" y="330" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5d7078">−0.366</text><text x="780" y="330" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5d7078">0.366</text><text x="850" y="330" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5d7078">1.366</text><text x="745" y="126" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#7564ad">每点概率 1/4</text><text x="40" y="378" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">两图均值为 0、方差为 1，故 R(τ)=cos(τ·60°) 只依赖时差：宽平稳；但边缘分布不同，故不严平稳。</text></svg>
