<text x="120" y="96" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#7564ad">K=2（M=128，分辨率最高，起伏最大）</text>
<text x="120" y="116" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#2f7d7b">K=8（M=32）</text>
<text x="120" y="136" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ce704f">K=32（M=8，最平滑，峰最宽）</text>
<text x="90" y="378" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5d7078">同一份数据、同一总长度 N：方差随 K 下降，分辨率随 M=N/K 下降，二者不可兼得。</text>
</svg>
