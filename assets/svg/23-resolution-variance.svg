<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="t d">
<title id="t">分段数 K 决定方差与分辨率的折中</title>
<desc id="d">同一条数据用 Bartlett 法取 K=2、8、32 段的谱估计（分贝），K 越大曲线越平滑但谱峰越宽，频率分辨率约等于 1/M=M分之一。</desc>
<rect width="1000" height="400" rx="19" fill="#fffdf8"/>
<text x="28" y="41" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">方差–分辨率折中：K 越大越平滑，峰越宽</text>
