<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="fig07a-title fig07a-desc"><title id="fig07a-title">自相关函数随时滞的衰减刻画信号变化快慢</title><desc id="fig07a-desc">左图窄带信号的自相关是缓慢衰减的余弦，右图宽带信号的自相关在很小时滞后就衰减到零。两者都在时滞零处取峰值R(0)=E[X²]，且关于零点对称。</desc><rect width="1000" height="400" rx="19" fill="#fffdf8"/><text x="28" y="40" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">自相关随时滞 τ 的衰减，反映原始信号的“变化快慢”</text><g stroke="#dce7e6" stroke-width="1"><line x1="70" y1="330" x2="470" y2="330"/><line x1="270" y1="90" x2="270" y2="340"/></g><text x="470" y="352" text-anchor="end" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">时滞 τ →</text><text x="58" y="98" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">R(τ)</text><path d="M70 170 Q110 110 150 145 Q190 180 230 150 Q270 92 310 138 Q350 182 390 152 Q430 118 470 168" fill="none" stroke="#137f83" stroke-width="3"/><circle cx="270" cy="92" r="5" fill="#137f83"/><text x="282" y="88" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#137f83">峰值 R(0)=E[X²]</text><text x="70" y="376" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#137f83">窄带 / 低频：缓慢衰减，保留周期</text><g stroke="#f0dcd3" stroke-width="1"><line x1="560" y1="330" x2="960" y2="330"/><line x1="760" y1="90" x2="760" y2="340"/></g><text x="960" y="352" text-anchor="end" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">时滞 τ →</text><path d="M560 262 Q600 196 640 250 Q680 300 720 272 Q760 92 800 270 Q840 300 880 252 Q920 200 960 262" fill="none" stroke="#ce704f" stroke-width="3"/><circle cx="760" cy="92" r="5" fill="#ce704f"/><text x="772" y="88" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ce704f">峰值 R(0)=E[X²]</text><text x="560" y="376" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ce704f">宽带 / 高频：迅速衰减到零</text><text x="29" y="392" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">纵轴为教学示意曲线；两条曲线都在 τ=0 取得最大值，且关于 τ=0 对称。</text></svg>
