<title id="t">矩形窗与汉宁窗的旁瓣泄漏对比</title>
<desc id="d">单频正弦（非整数 bin）分别加矩形窗与汉宁窗后的归一化谱（分贝），矩形窗第一旁瓣约负十三点五分贝，汉宁窗约负三十一点五分贝。</desc>
<rect width="1000" height="400" rx="19" fill="#fffdf8"/>
