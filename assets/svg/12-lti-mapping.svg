<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="fig12a-title fig12a-desc"><title id="fig12a-title">随机信号通过线性时不变系统的时域映射</title><desc id="fig12a-desc">输入随机信号经过冲激响应为h的线性时不变系统得到输出；输出均值等于输入均值卷积h，互相关等于输入自相关卷积h，输出自相关则要做两次卷积。</desc><rect width="1000" height="400" rx="19" fill="#fffdf8"/><text x="28" y="40" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">期望与卷积可交换：线性算子让统计量按同一结构传递</text><line x1="90" y1="150" x2="330" y2="150" stroke="#20343d" stroke-width="2.4"/><polygon points="330,150 318,144 318,156" fill="#20343d"/><rect x="330" y="110" width="220" height="80" rx="10" fill="#eef7f4" stroke="#137f83" stroke-width="2"/><text x="440" y="158" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#137f83">LTI：h(t)，H(ω)</text><line x1="550" y1="150" x2="800" y2="150" stroke="#20343d" stroke-width="2.4"/><polygon points="800,150 788,144 788,156" fill="#20343d"/><text x="200" y="136" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#137f83">X(t)</text><text x="200" y="176" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">均值 μ_X，自相关 R_X</text><text x="880" y="136" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#7564ad">Y(t)</text><text x="880" y="176" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">均值 μ_Y，自相关 R_Y</text><line x1="60" y1="216" x2="940" y2="216" stroke="#e1eaea"/><text x="60" y="252" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#137f83">μ_Y = μ_X ∗ h</text><text x="60" y="288" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#7564ad">R_XY = R_X ∗ h　（互相关过一次系统）</text><text x="60" y="324" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ce704f">R_Y = R_X ∗ h ∗ h(−τ)　（自相关过两次）</text><text x="29" y="390" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">WSS 输入时：μ_Y=μ_X·H(0)，R_XY(τ)=R_X(τ)∗h(τ)，R_Y(τ)=R_X(τ)∗ϕ_h(τ)，ϕ_h=h∗h(−τ)。</text></svg>
