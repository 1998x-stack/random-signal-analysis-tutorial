<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="fig08a-title fig08a-desc"><title id="fig08a-title">宽平稳的三个条件：均值恒定、二阶矩有限、自相关只看时差</title><desc id="fig08a-desc">上方两条不同绝对时刻的观测窗口得到相同的均值与方差带；下方自相关只由时差τ决定，两段等长时差在不同起点给出同一数值。</desc><rect width="1000" height="420" rx="19" fill="#fffdf8"/><text x="28" y="40" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">宽平稳要求：均值 μ 恒定、E[|X|²] 有限、R 只依赖 τ</text><rect x="40" y="60" width="920" height="150" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="58" y="86" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#137f83">不同绝对时刻的两段观测</text><rect x="70" y="100" width="330" height="92" rx="8" fill="#eef7f4"/><rect x="470" y="100" width="330" height="92" rx="8" fill="#eef7f4"/><line x1="70" y1="146" x2="400" y2="146" stroke="#137f83" stroke-width="2" stroke-dasharray="6 4"/><line x1="470" y1="146" x2="800" y2="146" stroke="#137f83" stroke-width="2" stroke-dasharray="6 4"/><path d="M70 146 Q120 118 170 150 Q220 178 270 140 Q320 108 370 146 Q385 156 400 146" fill="none" stroke="#137f83" stroke-width="2.2"/><path d="M470 146 Q520 118 570 150 Q620 178 670 140 Q720 108 770 146 Q785 156 800 146" fill="none" stroke="#7564ad" stroke-width="2.2"/><text x="200" y="188" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">均值、方差相同</text><text x="600" y="188" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">均值、方差仍相同</text><rect x="40" y="230" width="920" height="150" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="58" y="256" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#7564ad">自相关只由时差 τ = t₂ − t₁ 决定</text><line x1="80" y1="300" x2="930" y2="300" stroke="#dce7e6"/><line x1="150" y1="300" x2="330" y2="300" stroke="#ce704f" stroke-width="3"/><line x1="150" y1="288" x2="150" y2="312" stroke="#ce704f"/><line x1="330" y1="288" x2="330" y2="312" stroke="#ce704f"/><line x1="600" y1="300" x2="780" y2="300" stroke="#ce704f" stroke-width="3"/><line x1="600" y1="288" x2="600" y2="312" stroke="#ce704f"/><line x1="780" y1="288" x2="780" y2="312" stroke="#ce704f"/><text x="240" y="336" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ce704f">时差 τ</text><text x="690" y="336" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ce704f">同一时差 τ → 同一 R(τ)</text><text x="29" y="410" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">E[|X|²] 有限是前提；把它解读为“功率”需约定 1 Ω 归一化负载。</text></svg>
