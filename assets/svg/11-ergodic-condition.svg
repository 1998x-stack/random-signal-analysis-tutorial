<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="fig11c-title fig11c-desc"><title id="fig11c-title">自协方差是否绝对可积决定均值各态历经的充分条件</title><desc id="fig11c-desc">左图自协方差随时间差指数衰减，其时间积分有限，是均值各态历经的充分条件；右图自协方差恒为正常数，积分发散，过程不是均值各态历经的。</desc><rect width="1000" height="400" rx="19" fill="#fffdf8"/><text x="28" y="40" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">充分条件：∫|C_X(τ)|dτ 有限</text><rect x="40" y="62" width="440" height="290" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="60" y="90" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#137f83">指数衰减：积分有限 → 均值各态历经</text><line x1="70" y1="280" x2="450" y2="280" stroke="#dce7e6"/><line x1="255" y1="120" x2="255" y2="292" stroke="#dce7e6"/><path d="M255 130 Q300 132 340 200 Q390 268 450 278" fill="none" stroke="#137f83" stroke-width="3"/><path d="M255 130 Q300 132 340 200 Q390 268 450 278 L255 278 Z" fill="#d9f0eb" opacity="0.55" stroke="none"/><text x="340" y="248" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#137f83">面积有限</text><text x="255" y="304" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">τ</text><text x="244" y="122" text-anchor="end" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">C_X(0)</text><rect x="520" y="62" width="440" height="290" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="540" y="90" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#ce704f">恒为正常数：积分发散 → 不各态历经</text><line x1="560" y1="280" x2="940" y2="280" stroke="#dce7e6"/><line x1="750" y1="120" x2="750" y2="292" stroke="#dce7e6"/><line x1="570" y1="180" x2="930" y2="180" stroke="#ce704f" stroke-width="3.4"/><text x="820" y="170" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ce704f">C_X(τ)=σ²&gt;0</text><text x="750" y="304" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">τ</text><text x="29" y="392" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">∫|C_X|dτ&lt;∞ 是充分而非必要条件；精确条件用到 (1/T)∫(1−τ/T)C_X(τ)dτ 的极限。</text></svg>
