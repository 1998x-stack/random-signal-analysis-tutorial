<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">离散分布的期望是概率重心</title><desc id="figure-desc">概率质量分别是0.25、0.50、0.25，落在0、1、2，均值在1；即使概率质量集中在两端，均值也不一定是一个实际结果。</desc><rect width="1000" height="380" rx="19" fill="#fffdf8"/><text x="38" y="43" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" fill="#20343d" font-weight="700">概率质量如何决定“重心”？</text><rect x="30" y="70" width="655" height="265" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><line x1="88" y1="288" x2="633" y2="288" stroke="#20343d" stroke-width="2" /><rect x="124" y="200" width="68" height="88" rx="7" fill="#e6edf6" stroke="#7564ad" stroke-width="1.3"/><text x="134" y="188" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#20343d" >0.25</text><text x="151" y="317" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#20343d" >0</text><rect x="332" y="112" width="68" height="176" rx="7" fill="#bee2d9" stroke="#137f83" stroke-width="1.3"/><text x="342" y="100" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#20343d" >0.50</text><text x="359" y="317" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#20343d" >1</text><rect x="540" y="200" width="68" height="88" rx="7" fill="#e6edf6" stroke="#7564ad" stroke-width="1.3"/><text x="550" y="188" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#20343d" >0.25</text><text x="567" y="317" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#20343d" >2</text><line x1="366" y1="91" x2="366" y2="289" stroke="#ce704f" stroke-width="3" stroke-dasharray="7 6"/><text x="380" y="111" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#ce704f" font-weight="700">均值 μ = 1</text><rect x="715" y="79" width="256" height="250" rx="12" fill="#ebf6f3" stroke="#137f83" stroke-width="1.3"/><text x="734" y="121" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#20343d" font-weight="700">期望不是“最常见值”</text><text x="734" y="158" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#20343d" >E[X] = Σ x · P(X=x)</text><text x="734" y="193" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#20343d" >0 × 0.25</text><text x="734" y="219" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#20343d" >+ 1 × 0.50</text><text x="734" y="245" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#20343d" >+ 2 × 0.25</text><text x="734" y="286" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" fill="#137f83" font-weight="700">= 1</text></svg>