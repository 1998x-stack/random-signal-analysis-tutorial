<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">线性相关与非线性依赖对照</title><desc id="figure-desc">左侧点落在正斜率直线上相关系数等于1；右侧Y=X平方，X取负一、零、正一等概率，协方差是0但Y被X完全确定。</desc><rect width="1000" height="380" rx="19" fill="#fffdf8"/><text x="38" y="42" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" fill="#20343d" font-weight="700">相关系数只捕捉线性关联</text><rect x="25" y="63" width="465" height="274" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><rect x="510" y="63" width="465" height="274" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="44" y="96" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#137f83" font-weight="700">线性：Y = 2X + 1，ρ = +1</text><text x="529" y="96" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#7564ad" font-weight="700">非线性：Y = X²，Cov = 0</text><line x1="74" y1="286" x2="453" y2="286" stroke="#20343d" stroke-width="2" /><line x1="144" y1="308" x2="144" y2="116" stroke="#20343d" stroke-width="2" /><line x1="550" y1="286" x2="932" y2="286" stroke="#20343d" stroke-width="2" /><line x1="741" y1="305" x2="741" y2="112" stroke="#20343d" stroke-width="2" /><path d="M166 263 L286 214 L410 165" stroke="#137f83" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="166" cy="263" r="8" fill="#137f83"/><circle cx="286" cy="214" r="8" fill="#137f83"/><circle cx="410" cy="165" r="8" fill="#137f83"/><circle cx="615" cy="166" r="9" fill="#ce704f" stroke="white" stroke-width="2"/><circle cx="741" cy="283" r="9" fill="#ce704f" stroke="white" stroke-width="2"/><circle cx="867" cy="166" r="9" fill="#ce704f" stroke="white" stroke-width="2"/><text x="75" y="323" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#5d7078" >线性变换（非零斜率）</text><text x="552" y="323" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#5d7078" >U 形依赖并不会消失</text></svg>