<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="fig09a-title fig09a-desc"><title id="fig09a-title">维纳-辛钦定理：指数型自相关对应洛伦兹型功率谱</title><desc id="fig09a-desc">左图是随时间差指数衰减的自相关函数，右图是它在角频率上的功率谱，呈现低频集中的洛伦兹形状。两者由傅里叶变换相互确定。</desc><rect width="1000" height="400" rx="19" fill="#fffdf8"/><text x="28" y="40" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">时域自相关 ⇄ 频域功率谱（同一信息，两种语言）</text><rect x="40" y="62" width="430" height="292" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="60" y="90" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#137f83">自相关 R(τ)=σ²e^(−α|τ|)</text><line x1="70" y1="300" x2="450" y2="300" stroke="#dce7e6"/><line x1="255" y1="110" x2="255" y2="312" stroke="#dce7e6"/><path d="M70 296 Q160 288 220 200 Q255 148 260 146 Q300 190 360 288 Q420 296 450 298" fill="none" stroke="#137f83" stroke-width="3"/><circle cx="255" cy="148" r="4.5" fill="#137f83"/><text x="264" y="140" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#137f83">R(0)=σ²</text><text x="420" y="322" text-anchor="end" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">τ</text><rect x="530" y="62" width="430" height="292" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="550" y="90" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#7564ad">功率谱 S(ω)=2ασ²/(α²+ω²)</text><line x1="560" y1="300" x2="940" y2="300" stroke="#dce7e6"/><line x1="750" y1="110" x2="750" y2="312" stroke="#dce7e6"/><path d="M560 296 Q620 294 680 280 Q740 240 750 130 Q770 236 810 278 Q880 294 940 296" fill="none" stroke="#7564ad" stroke-width="3"/><text x="762" y="122" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#7564ad">S(0)=2σ²/α</text><text x="910" y="322" text-anchor="end" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#5d7078">ω</text><text x="40" y="378" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">本章约定：S(ω)=∫R(τ)e^(−jωτ)dτ，R(τ)=(1/2π)∫S(ω)e^(jωτ)dω；曲线为教学示意。</text></svg>
