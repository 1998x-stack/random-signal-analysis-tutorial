<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc"><title id="title">不相关但不独立的离散例子</title><desc id="desc">X均匀取负一、零、正一，Y等于X的平方；点落在抛物线上，协方差为零但Y完全由X确定。</desc><rect width="1000" height="380" fill="#fffdf8" rx="20"/><text x="30" y="42" font-size="22" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">X ∈ {−1, 0, 1} 等概率；Y = X²</text><rect x="30" y="65" width="620" height="270" rx="14" fill="#fff" stroke="#d8e3e3" stroke-width="1.5"/><line x1="100" y1="289" x2="590" y2="289" stroke="#223743" stroke-width="2" /><line x1="346" y1="310" x2="346" y2="100" stroke="#223743" stroke-width="2" /><text x="590" y="313" font-size="17" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">X</text><text x="359" y="107" font-size="17" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">Y</text><line x1="346" y1="169" x2="100" y2="169" stroke="#e6ebeb" stroke-width="1" /><line x1="346" y1="169" x2="590" y2="169" stroke="#e6ebeb" stroke-width="1" /><circle cx="190" cy="169" r="8" fill="#137d83" stroke="white" stroke-width="3"/><circle cx="346" cy="289" r="8" fill="#d56c4e" stroke="white" stroke-width="3"/><circle cx="502" cy="169" r="8" fill="#137d83" stroke="white" stroke-width="3"/><text x="170" y="317" font-size="17" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">−1</text><text x="340" y="317" font-size="17" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">0</text><text x="500" y="317" font-size="17" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">1</text><text x="360" y="176" font-size="15" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">1</text><rect x="675" y="86" width="296" height="220" rx="14" fill="#edf7f6" stroke="#137d83" stroke-width="1.5"/><text x="695" y="126" font-size="20" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">E[X] = 0</text><text x="695" y="161" font-size="18" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">E[XY] = E[X³] = 0</text><text x="695" y="201" font-size="21" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">Cov(X,Y) = 0</text><text x="695" y="245" font-size="18" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">但给定 X，可确定 Y</text><text x="695" y="272" font-size="18" fill="#d56c4e" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">所以并不独立</text></svg>