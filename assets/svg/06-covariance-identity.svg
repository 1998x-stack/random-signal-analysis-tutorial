<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">自相关由自协方差与均值乘积组成</title><desc id="figure-desc">取B为1或2且各占二分之一，X(t)=B，是一个时间不变的随机过程。均值为1.5，自相关为2.5，自协方差为0.25，均值平方为2.25。</desc><rect width="1000" height="380" rx="19" fill="#fffdf8"/><text x="34" y="42" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#20343d" font-weight="700">一个非零均值过程：X(t) = B，B∈{1,2} 等概率</text><rect x="34" y="78" width="932" height="234" rx="12" fill="#fff" stroke="#e1eaea" stroke-width="1.3"/><text x="58" y="116" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#5d7078" >任意两个时刻 t₁、t₂</text><rect x="69" y="148" width="255" height="99" rx="12" fill="#e7f4f1" stroke="#137f83" stroke-width="1.3"/><text x="85" y="183" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#137f83" font-weight="700">自相关 R = 2.50</text><text x="86" y="213" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#20343d" >E[B²] = (1+4)/2</text><text x="351" y="206" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="35" fill="#20343d" >=</text><rect x="400" y="148" width="236" height="99" rx="12" fill="#f3effa" stroke="#7564ad" stroke-width="1.3"/><text x="415" y="183" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#7564ad" font-weight="700">自协方差 C = 0.25</text><text x="418" y="213" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#20343d" >Var(B)</text><text x="659" y="206" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="33" fill="#20343d" >+</text><rect x="713" y="148" width="226" height="99" rx="12" fill="#fff0e9" stroke="#ce704f" stroke-width="1.3"/><text x="728" y="183" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#ce704f" font-weight="700">均值积 = 2.25</text><text x="728" y="213" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#20343d" >μ² = 1.5²</text><text x="33" y="358" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#5d7078" >R(t₁,t₂) = C(t₁,t₂) + μ(t₁)μ(t₂)，二者不能混写。</text></svg>