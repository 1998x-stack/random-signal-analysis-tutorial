<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="t d">
<title id="t">Levinson-Durbin 格型递推：逐级加入反射系数</title>
<desc id="d">格型结构示意图：前向误差向右传播、后向误差向左传播，每级由反射系数 K 耦合；所有 K 的绝对值小于 1 对应模型稳定。</desc>
<rect width="1000" height="360" rx="19" fill="#fffdf8"/>
<text x="28" y="41" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">Levinson-Durbin 格型递推（O(p²)）</text>
<rect x="120" y="150" width="120" height="70" rx="12" fill="#eef5f4" stroke="#2f7d7b"/>
<text x="180" y="192" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#20343d">K1</text>
<rect x="370" y="150" width="120" height="70" rx="12" fill="#eef5f4" stroke="#2f7d7b"/>
<text x="430" y="192" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#20343d">K2</text>
<rect x="620" y="150" width="120" height="70" rx="12" fill="#eef5f4" stroke="#2f7d7b"/>
<text x="680" y="192" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#20343d">K3</text>
<g stroke="#2f7d7b" stroke-width="2.4" fill="none" marker-end="url(#a)"><path d="M40 170 H108"/><path d="M242 170 H358"/><path d="M492 170 H608"/><path d="M742 170 H930"/></g>
<g stroke="#ce704f" stroke-width="2.4" fill="none" marker-end="url(#b)"><path d="M930 202 H748"/><path d="M608 202 H498"/><path d="M358 202 H248"/><path d="M108 202 H44"/></g>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f7d7b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ce704f"/></marker></defs>
<text x="40" y="150" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#2f7d7b">前向误差 f₀</text>
<text x="930" y="238" text-anchor="end" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ce704f">后向误差 b₀</text>
<text x="500" y="92" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5d7078">每级：aᵢ ← aᵢ + Kₘ·aₘ₋ᵢ，σ²ₘ = σ²ₘ₋₁(1−Kₘ²)</text>
<text x="90" y="320" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#5d7078">稳定判据：|Kₘ| &lt; 1（等价于 AR 多项式根在单位圆内）。反射系数也直接对应物理层间反射；此图为结构示意。</text>
</svg>
