<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 375" role="img" aria-labelledby="title desc"><title id="title">协方差矩阵决定高斯等密度椭圆</title><desc id="desc">二维高斯的等马氏距离轮廓在中心均值向量处同心；特征向量决定轴方向，特征值平方根决定相应轴的伸展尺寸。协方差矩阵为[[4,1.5],[1.5,1]]，有正相关且正定。</desc><rect width="1000" height="375" fill="#fffdf8" rx="20"/><text x="36" y="44" font-size="22" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">Σ = [[4, 1.5], [1.5, 1]]：相关性使椭圆倾斜</text><rect x="30" y="63" width="630" height="285" rx="14" fill="#fff" stroke="#d8e3e3" stroke-width="1.5"/><line x1="62" y1="205" x2="633" y2="205" stroke="#e6ebeb" stroke-width="1.5" /><line x1="344" y1="324" x2="344" y2="86" stroke="#e6ebeb" stroke-width="1.5" /><g transform="translate(344 205) rotate(-22.5)"><ellipse rx="225" ry="65" fill="#e0f4f0" stroke="#137d83" stroke-width="3"/><ellipse rx="151" ry="43" fill="#bddfd7" stroke="#137d83" stroke-width="2"/><ellipse rx="78" ry="23" fill="#8ac9bb" stroke="#137d83" stroke-width="2"/><line x1="-225" y1="0" x2="225" y2="0" stroke="#d56c4e" stroke-width="3"/><line x1="0" y1="-65" x2="0" y2="65" stroke="#7566b0" stroke-width="3"/></g><circle cx="344" cy="205" r="6" fill="#223743"/><text x="355" y="219" font-size="18" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">μ</text><rect x="684" y="78" width="289" height="240" rx="14" fill="#f4f6fb" stroke="#7566b0" stroke-width="1.5"/><text x="703" y="115" font-size="20" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">Σ 的特征分解</text><text x="703" y="154" font-size="17" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">长轴：最大特征值方向</text><text x="703" y="189" font-size="17" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">短轴：最小特征值方向</text><text x="703" y="235" font-size="20" font-weight="650" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">轮廓：d² = 常数</text><text x="703" y="274" font-size="16" font-family="system-ui,-apple-system,'Noto Sans CJK SC','Microsoft Yahei',sans-serif" fill="#223743">d² = (x−μ)ᵀΣ⁻¹(x−μ)</text></svg>