<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="fig07b-title fig07b-desc"><title id="fig07b-title">互相关峰值位置给出两路信号的时延</title><desc id="fig07b-desc">上方近端麦克风信号与延后D的远端信号波形形状相同；下方两者互相关在时滞等于D处达到峰值，噪声项平均后不贡献峰值。</desc><rect width="1000" height="400" rx="19" fill="#fffdf8"/><text x="28" y="40" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">互相关：时延估计的峰值定位</text><line x1="60" y1="120" x2="940" y2="120" stroke="#dce7e6"/><text x="60" y="150" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#137f83">近端 X₁(t)=S(t)+N₁(t)</text><path d="M60 112 L110 70 L160 118 L210 66 L260 114 L310 74 L360 112 L410 70 L460 116 L510 68 L560 114 L610 72 L660 112 L710 70 L760 116 L810 76 L860 114 L910 74 L940 100" fill="none" stroke="#137f83" stroke-width="2.4"/><line x1="60" y1="210" x2="940" y2="210" stroke="#dce7e6"/><text x="60" y="240" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#ce704f">远端 X₂(t)=S(t−D)+N₂(t)，整体右移 D</text><path d="M60 202 L110 200 L160 160 L210 208 L260 156 L310 204 L360 164 L410 202 L460 160 L510 206 L560 158 L610 204 L660 162 L710 202 L760 160 L810 206 L860 166 L910 204 L940 190" fill="none" stroke="#ce704f" stroke-width="2.4"/><line x1="60" y1="340" x2="940" y2="340" stroke="#dce7e6"/><text x="60" y="368" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#7564ad">互相关 Rₓ₁ₓ₂(τ)</text><path d="M60 332 Q200 330 320 320 Q420 300 480 200 Q540 300 640 322 Q780 332 940 334" fill="none" stroke="#7564ad" stroke-width="3"/><line x1="480" y1="200" x2="480" y2="340" stroke="#7564ad" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="480" cy="200" r="5" fill="#7564ad"/><text x="490" y="192" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#7564ad">峰值位于 τ = D</text><text x="29" y="392" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#5d7078">横轴为时滞 τ；曲线为教学示意，D 由声源到两麦克风的行程差决定。</text></svg>
