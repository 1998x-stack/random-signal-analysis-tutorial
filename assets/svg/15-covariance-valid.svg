<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="fig15d-title fig15d-desc">
<title id="fig15d-title">协方差函数必须非负定，否则不构成合法高斯过程</title>
<desc id="fig15d-desc">左侧示例协方差矩阵的特征值都大于等于零，对应合法的高斯过程；右侧示例含负特征值，相应线性组合的方差为负，无法定义任何高斯分布。</desc>
<rect width="1000" height="400" rx="19" fill="#fffdf8"/>
<text x="28" y="41" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#20343d" font-weight="700">C(tᵢ,tⱼ) 必须非负定：任意线性组合的方差 ≥ 0</text>
<rect x="60" y="80" width="390" height="250" rx="14" fill="#eef7f5" stroke="#9dc9c4"/>
<text x="90" y="118" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#0b585e" font-weight="700">合法：特征值 λ ≥ 0</text>
<text x="90" y="160" font-family="ui-monospace,Consolas,monospace" font-size="16" fill="#20343d">C = [ 4   1 ]</text>
<text x="90" y="186" font-family="ui-monospace,Consolas,monospace" font-size="16" fill="#20343d">    [ 1   2 ]</text>
<text x="90" y="224" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#137f83">λ = 4.41 与 1.59，均 &gt; 0</text>
<ellipse cx="320" cy="210" rx="82" ry="48" fill="#d6f1eb" stroke="#137f83" stroke-width="2" transform="rotate(-16 320 210)"/>
<text x="320" y="300" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#5d7078">对应合法椭圆等高线</text>
<rect x="550" y="80" width="390" height="250" rx="14" fill="#fff3ed" stroke="#e0a58c"/>
<text x="580" y="118" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#a04a2e" font-weight="700">非法：出现 λ &lt; 0</text>
<text x="580" y="160" font-family="ui-monospace,Consolas,monospace" font-size="16" fill="#20343d">C = [ 1   2 ]</text>
<text x="580" y="186" font-family="ui-monospace,Consolas,monospace" font-size="16" fill="#20343d">    [ 2   1 ]</text>
<text x="580" y="224" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#ce704f">λ = 3 与 −1：Var(a₁X₁+a₂X₂) 可为负</text>
<g transform="translate(810,205)">
<line x1="-90" y1="0" x2="90" y2="0" stroke="#e0a58c" stroke-dasharray="5 5"/>
<line x1="0" y1="-70" x2="0" y2="70" stroke="#e0a58c" stroke-dasharray="5 5"/>
<text x="0" y="-6" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#ce704f">无法定义</text>
</g>
<text x="810" y="300" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#5d7078">不存在对应的实椭圆</text>
</svg>
